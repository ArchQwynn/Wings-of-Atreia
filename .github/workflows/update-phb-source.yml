name: Update PHB Source Labels

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-phb-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update only PHB source/version wording on class pages
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              "classes/gladiator.html",
              "classes/templar.html",
              "classes/assassin.html",
              "classes/ranger.html",
              "classes/sorcerer.html",
              "classes/spiritmaster.html",
              "classes/cleric.html",
              "classes/chanter.html",
              "classes/aethertech.html",
              "classes/gunslinger.html",
              "classes/songweaver.html",
          ]

          replacements = {
              "Player Handbook v3.10": "Player Handbook v3.16",
              "Player Handbook v3.14": "Player Handbook v3.16",
          }

          changed = []
          for name in files:
              path = Path(name)
              original = path.read_text(encoding="utf-8")
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8", newline="")
                  changed.append(name)

          print("Updated:")
          for name in changed:
              print(f" - {name}")
          PY

      - name: Commit only the source-label changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classes/gladiator.html classes/templar.html classes/assassin.html classes/ranger.html classes/sorcerer.html classes/spiritmaster.html classes/cleric.html classes/chanter.html classes/aethertech.html classes/gunslinger.html classes/songweaver.html
          git rm .github/workflows/update-phb-source.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Standardize class PHB source labels to v3.16"
          git push
