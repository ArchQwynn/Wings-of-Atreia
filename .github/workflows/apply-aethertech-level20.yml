name: Apply Aethertech Level 20 Update

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-aethertech-level20.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Aethertech Level 20
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('classes/aethertech.html')
          h = p.read_text(encoding='utf-8')
          old = '''<h2 class="level-heading" id="level-20">Level 20</h2><p>Aethertech Ascendant. Perfect Reactor starts genuine combat with at least half maximum Core and Heat no higher than 3. Eternal Bastion: first time each combat an operational Bastion would fall to 0, it remains at 1 HP. Master Engineer once/turn after spending Core on one system, gaining Heat from a different system, and hitting with a Bastion weapon chooses +1 Core, -1 Heat, or repair PB+INT. Aether Dominion 1/LR Bonus Action for 1 minute raises operating maximum Heat by 2, allows Core Overflow, improves the first Vent each round, adds +2d10 to one cannon hit each round, and grants the finalized System Supremacy options without creating another Attack action.</p><h3 id="apex-aethercore-annihilation">Apex Aethercore Annihilation</h3>'''
          new = '''<h2 class="level-heading" id="level-20">Level 20</h2><p><strong>Aethertech Ascendant.</strong> Perfect Reactor starts genuine combat with at least half maximum Core and Heat no higher than 3. <strong>Eternal Bastion.</strong> The first time each combat an operational Bastion would fall to 0, it remains at 1 HP. <strong>Master Engineer.</strong> Once per turn after spending Core on one system, gaining Heat from a different system, and hitting with a Bastion weapon, choose one: gain +1 Core; reduce Heat by 1; or repair the Bastion for PB + INT modifier HP. <strong>Aether Dominion — 1/Long Rest.</strong> As a Bonus Action, you enter Aether Dominion for 1 minute. Your operating maximum Heat increases by 2. Core Overflow allows you to hold up to 2 Core above your normal maximum while Aether Dominion is active; those excess Core disappear when Aether Dominion ends. The first Vent you use each round reduces 1 additional Heat, and once each round one Aether Cannon hit deals an additional +2d10 damage. Aether Dominion does not create another Attack action. While Aether Dominion is active, your chosen System Supremacy Protocol enters its enhanced state.</p><h3 id="system-supremacy">System Supremacy</h3><p>When you finish a Long Rest, choose one System Supremacy Protocol: <strong>Bastion Protocol, Control Protocol, or Overclock Protocol.</strong> Your chosen protocol remains active until you finish another Long Rest.</p><p><strong>Bastion Protocol.</strong> While your Aether Core is active, you gain a +1 bonus to AC. Once per round, when a creature within 10 feet of you is hit by an attack, you may use your Reaction to reduce the damage dealt to that creature by an amount equal to your Proficiency Bonus.</p><p><strong>Bastion Protocol — Enhanced.</strong> While Aether Dominion is active, the damage reduction increases to 1d10 + your Intelligence modifier, and its range increases to 30 feet.</p><p><strong>Control Protocol.</strong> Once on each of your turns when your Aether Cannon or Aether Lancer hits a creature, you may push that creature up to 5 feet to an unoccupied space you can see. This movement does not provoke Opportunity Attacks.</p><p><strong>Control Protocol — Enhanced.</strong> While Aether Dominion is active, the forced movement increases to 10 feet. Instead of pushing the creature, you may reduce its Speed by 20 feet until the start of your next turn.</p><p><strong>Overclock Protocol.</strong> Once on each of your turns when you successfully use an Aethertech utility feature, you may reduce the Heat generated by your next Aethertech feature by 1. Immediately after using that utility feature, you may also move up to 10 feet without provoking Opportunity Attacks.</p><p><strong>Overclock Protocol — Enhanced.</strong> While Aether Dominion is active, when you trigger Overclock Protocol, you may also grant one ally within 30 feet of you Advantage on its next attack roll made before the start of your next turn.</p><h3 id="apex-aethercore-annihilation">Apex Aethercore Annihilation</h3>'''
          if old not in h:
              raise SystemExit('Expected original Level 20 block not found; aborting without changes.')
          h = h.replace(old, new, 1)
          old_row = 'For 1 minute, raise operating maximum Heat by 2, allow Core Overflow, improve the first Vent each round, strengthen Cannon output, and use the printed System Supremacy options.'
          new_row = 'For 1 minute, raise operating maximum Heat by 2; allow up to 2 Core above normal maximum; the first Vent each round reduces 1 additional Heat; one Aether Cannon hit each round deals +2d10 damage; and your chosen System Supremacy Protocol is enhanced.'
          if old_row not in h:
              raise SystemExit('Expected Aether Dominion reference row not found; aborting without changes.')
          h = h.replace(old_row, new_row, 1)
          p.write_text(h, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add classes/aethertech.html
          git diff --cached --quiet && exit 0
          git commit -m 'Define Aethertech System Supremacy at Level 20'
          git push
