name: Rebuild WoA Search Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/js/search-index.json"
      - "sw.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-search-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild search index
        run: python scripts/build_search_index.py

      - name: Update full-search results navigation
        shell: python
        run: |
          from pathlib import Path

          search = Path("assets/js/search-v20260914-6.js")
          text = search.read_text(encoding="utf-8")

          old = '''    } else if (event.key === "Enter") {
      const target = activeIndex >= 0 ? links[activeIndex] : links[0];
      if (target) window.location.href = target.href;
    }'''
          new = '''    } else if (event.key === "Enter") {
      event.preventDefault();
      const query = input.value.trim();
      if (query) {
        window.location.href = `${base}search-results.html?q=${encodeURIComponent(query)}`;
      }
    }'''
          if old not in text:
              raise SystemExit("Expected Enter handler was not found; refusing to modify search.js.")
          text = text.replace(old, new, 1)
          text = text.replace("search-index.json?v=20260914-5", "search-index.json?v=20261001-1", 1)
          search.write_text(text, encoding="utf-8")

      - name: Refresh PWA cache version when generated assets change
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone
          import re

          sw = Path("sw.js")
          text = sw.read_text(encoding="utf-8")
          stamp = datetime.now(timezone.utc).strftime("%Y%m%d-%H%M")
          text, n1 = re.subn(r'const CACHE_VERSION = "[^"]+";', f'const CACHE_VERSION = "woa-pwa-{stamp}";', text, count=1)
          text, n2 = re.subn(r'const RUNTIME_CACHE = "[^"]+";', f'const RUNTIME_CACHE = "woa-runtime-{stamp}";', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not locate PWA cache version constants in sw.js")

          if '"search-results.html"' not in text:
              text = text.replace('  "offline.html",', '  "offline.html",\n  "search-results.html",', 1)
          if '"assets/js/search-results.js?v=20261001-1"' not in text:
              marker = '  "assets/js/search-results.js?v=20261001-1",'
              if '"assets/js/search-v20260914-6.js"' in text:
                  text = text.replace('  "assets/js/search-v20260914-6.js",', '  "assets/js/search-v20260914-6.js",\n' + marker, 1)
              elif 'assets/js/search-v20260914-6.js' in text:
                  text = text.replace('"assets/js/search-v20260914-6.js"', '"assets/js/search-v20260914-6.js",\n' + marker, 1)
              else:
                  text = text.replace('  "assets/js/search-index.json",', '  "assets/js/search-index.json",\n' + marker, 1)

          sw.write_text(text, encoding="utf-8")

      - name: Commit generated search index, search UI, and PWA cache version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/search-index.json assets/js/search-v20260914-6.js search-results.html assets/js/search-results.js sw.js
          if git diff --cached --quiet; then
            echo "Search system is already current."
            exit 0
          fi
          git commit -m "Auto-update WoA search system"
          git push
