name: Rebuild WoA Search Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/js/search-index.json"
      - "sw.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-search-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild search index
        run: python scripts/build_search_index.py

      - name: Update full-search results navigation and PWA cache
        run: python scripts/update_search_ui.py

      - name: Commit generated search system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/search-index.json assets/js/search-v20260914-6.js search-results.html assets/js/search-results.js sw.js scripts/update_search_ui.py
          if git diff --cached --quiet; then
            echo "Search system is already current."
            exit 0
          fi
          git commit -m "Auto-update WoA search system"
          git push
