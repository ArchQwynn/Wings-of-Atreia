name: One-Time Assassin Rune Capacity Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-assassin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Assassin Rune Mark capacity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('classes/assassin.html')
          s = p.read_text(encoding='utf-8')
          old = '<li>A creature can carry up to 3 of your Rune Marks.</li>'
          new = '<li>A creature can carry up to 3 of your Rune Marks.</li><li>Rune Mark Capacity: A creature can never have more than 3 of your Rune Marks. Whenever a feature would place Rune Marks on a creature that already has 3 Rune Marks, place only enough Marks to reach 3; any excess Marks are lost. This limit applies regardless of how the Marks are generated, including Rune Carving, Masterful Carving, Perfect Marking, Relentless Execution, Perfect Preparation, Perfect Transition, and any Specialization feature.</li>'
          if old not in s:
              raise SystemExit('Expected Assassin Rune Mark capacity entry was not found; aborting without changes.')
          if 'Rune Mark Capacity:' in s:
              raise SystemExit('Rune Mark Capacity already exists; aborting without changes.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add classes/assassin.html .github/workflows/one-time-assassin-rune-capacity.yml
          git commit -m 'Clarify Assassin Rune Mark capacity'
          git rm .github/workflows/one-time-assassin-rune-capacity.yml
          git commit -m 'Remove one-time Assassin patch workflow'
          git push