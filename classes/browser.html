<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="../assets/css/style-v20260914-6.css" rel="stylesheet">
<title>Wings of Atreia — Class Browser Prototype</title>
<style>
:root{
  --bg:#081522;--panel:#102338;--panel2:#142d45;--panel3:#1a3854;
  --line:#29445d;--text:#e8f0f7;--muted:#a8bacb;--accent:#83c8f4;
  --accent2:#c5e8ff;--gold:#d7b875;--shadow:0 14px 38px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{margin:0;background:linear-gradient(180deg,#091827,#07121d 70%);color:var(--text);
  font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.site-header{position:sticky;top:0;z-index:20;background:rgba(7,18,29,.94);backdrop-filter:blur(12px)}
.nav-wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;width:100%;max-width:1600px;min-height:68px;margin:0 auto;padding:0 24px}
.nav-links{display:flex;align-items:center;justify-content:center;gap:18px;flex:1;flex-wrap:wrap}
.nav-links a{white-space:nowrap;color:var(--muted);font-size:.86rem}
.nav-links a:hover{color:var(--accent2)}
.search-box{flex:0 0 190px;max-width:190px}
.search-box input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#091a2a;color:var(--text)}
@media(max-width:900px){.nav-wrap{gap:12px;padding:0 14px}.nav-links{gap:10px}.search-box{flex-basis:145px;max-width:145px}}
@media(max-width:680px){.nav-wrap{min-height:58px;flex-wrap:wrap;padding:10px 14px}.nav-links{order:3;flex-basis:100%;justify-content:flex-start;gap:12px}.search-box{margin-left:auto;flex-basis:150px}}
.brand{font-weight:850;letter-spacing:.13em;color:var(--accent2);font-size:1rem}
.header-note{font-size:.78rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.layout{max-width:1600px;margin:auto;display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;padding:20px}
.sidebar{position:sticky;top:90px;align-self:start;height:calc(100vh - 112px);min-height:450px;
  background:rgba(16,35,56,.92);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sidebar-heading{font-size:.78rem;letter-spacing:.14em;color:var(--muted);font-weight:800;margin:2px 0 12px}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap input{width:100%;background:#091a2a;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);outline:none}
.search-wrap input:focus{border-color:var(--accent)}
.class-list{overflow:visible;display:flex;flex-direction:column;gap:2px;padding-right:0}
.class-button{display:block;text-align:left;width:100%;padding:5px 9px;border:1px solid transparent;
  border-radius:6px;background:transparent;color:var(--text);font-size:.84rem;line-height:1.25}
.class-button:hover{background:var(--panel2);border-color:var(--line)}
.class-button.active{background:linear-gradient(90deg,#1b4565,#15334e);border-color:#47799d;color:#fff}
.sidebar-footer{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted)}

.class-overview-panel{margin-top:16px;padding:17px 20px;background:rgba(16,35,56,.88);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.class-overview-panel h2{font-size:.78rem;letter-spacing:.14em;color:var(--muted);font-weight:800;margin:0 0 12px}
.class-overview-table{width:100%;border-collapse:collapse;table-layout:fixed}
.class-overview-table th,.class-overview-table td{padding:8px 10px;border-bottom:1px solid rgba(41,68,93,.7);
  font-size:.82rem;line-height:1.35;vertical-align:top;overflow-wrap:anywhere}
.class-overview-table tr:last-child th,.class-overview-table tr:last-child td{border-bottom:0}
.class-overview-table th{width:30%;color:var(--muted);font-weight:600;text-align:left}
.class-overview-table td{color:var(--text);font-weight:650;text-align:left}

.main{min-width:0}
.mobile-toolbar{display:none;margin-bottom:12px}
.menu-button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 13px}
.class-hero{padding:26px 30px;border:1px solid var(--line);border-radius:14px;
  background:radial-gradient(ellipse at top right,rgba(71,137,180,.2),transparent 55%),linear-gradient(130deg,#132d45,#0c1e30);box-shadow:var(--shadow)}
.eyebrow{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800}
h1{font-size:clamp(1.5rem,2.8vw,2.2rem);line-height:1.1;margin:.35rem 0 .6rem;letter-spacing:.015em}
.hero-description{color:var(--muted);max-width:850px;margin:0}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{border:1px solid #345873;border-radius:999px;padding:4px 10px;color:var(--accent2);font-size:.78rem;background:rgba(9,26,42,.55)}
.content-nav{position:sticky;top:78px;z-index:10;display:flex;gap:7px;overflow-x:auto;padding:12px 0;margin:0 0 8px;
  background:linear-gradient(180deg,rgba(8,21,34,.98),rgba(8,21,34,.9));scrollbar-width:thin}
.content-nav a{white-space:nowrap;padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:.82rem;color:var(--muted)}
.content-nav a:hover,.content-nav a.current{color:var(--accent2);border-color:#5484a5;background:var(--panel2);text-decoration:none}
.content-section{margin:18px 0;background:rgba(16,35,56,.72);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.content-section h2{font-size:1.35rem;margin:0 0 14px;color:var(--accent2)}
.content-section h3{font-size:1.05rem;margin:20px 0 8px}
.content-section p{color:#d4e0eb}
.muted{color:var(--muted)!important}
.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.info-tile{padding:12px;background:#0b1d2e;border:1px solid var(--line);border-radius:8px}
.info-tile small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.info-tile strong{display:block;margin-top:3px;font-weight:650}
/* Content-sized progression table with a frozen Level column */
.table-wrap{overflow-x:auto;max-width:100%;position:relative;overscroll-behavior-x:contain}
.progression-table{width:max-content;min-width:100%;table-layout:auto;border-collapse:separate;border-spacing:0}
.progression-table th,.progression-table td{white-space:normal;overflow-wrap:anywhere}
.progression-table th:nth-child(1),.progression-table td:nth-child(1){
  position:sticky;left:0;width:70px;min-width:70px;max-width:70px;text-align:center;
  white-space:nowrap;z-index:2;background:#142f49
}
.progression-table thead th:nth-child(1){z-index:4;background:#1a3b59}
.progression-table th:nth-child(2),.progression-table td:nth-child(2),
.progression-table th:nth-child(3),.progression-table td:nth-child(3){
  min-width:105px;text-align:center;white-space:nowrap
}
.progression-table .col-spell-level{min-width:155px}
.progression-table .col-spell-advancements{min-width:220px}
.progression-table .col-abilities{min-width:320px;width:420px}
.progression-table .col-resource{min-width:155px;width:180px}
.progression-table tbody tr:nth-child(odd) td:first-child{background:#10283e}
.progression-table tbody tr:nth-child(even) td:first-child{background:#0d2032}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:540px}
th,td{padding:10px 12px;text-align:left;border:1px solid var(--line);vertical-align:top}
th{background:#1a3b59;color:#f0f7fc;font-size:.83rem}
td{color:#d7e3ed}
tbody tr:nth-child(even){background:rgba(9,26,42,.45)}
.feature{border:1px solid var(--line);border-radius:9px;margin:10px 0;background:#0d2032;overflow:hidden}
.feature summary,.level summary{cursor:pointer;list-style:none;padding:13px 15px;color:var(--accent2);font-weight:700;display:flex;align-items:center;gap:10px}
.feature summary::-webkit-details-marker,.level summary::-webkit-details-marker{display:none}
.feature summary:before,.level summary:before{content:"＋";color:var(--accent);font-weight:900;width:16px}
.feature[open] summary:before,.level[open] summary:before{content:"−"}
.feature-body{padding:0 16px 15px;color:#d5e1eb}

.feature-heading{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.type-tag{display:inline-flex;align-items:center;border:1px solid #42627d;border-radius:999px;padding:2px 8px;
  font-size:.68rem;line-height:1.5;letter-spacing:.07em;text-transform:uppercase;color:var(--accent2);background:#142f47}
.type-tag.passive{border-color:#547b68;color:#bce4c9;background:#142e27}
.type-tag.active{border-color:#477da2;color:#bce5ff;background:#132e43}
.type-tag.reaction{border-color:#8b7448;color:#f0d9a7;background:#342b1a}
.type-tag.resource{border-color:#7962a0;color:#ddccff;background:#29213b}
.type-tag.specialization{border-color:#8d6480;color:#f1cce3;background:#352333}
.type-tag.ultimate{border-color:#a58a4c;color:#f4dfaa;background:#3a301b}
.feature-meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 12px}
.feature-meta span{font-size:.77rem;color:var(--muted);padding:3px 8px;border-radius:5px;background:#142b40;border:1px solid #29445d}
.feature-meta b{color:#dbeaf6;font-weight:650}
.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feature-grid .feature{margin:0}
.feature-type-intro{font-size:.88rem;color:var(--muted);margin:-5px 0 12px}

.feature-body p{margin:6px 0}
.level-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.level{border:1px solid var(--line);border-radius:9px;background:#0d2032;overflow:hidden}
.level summary{padding:11px 13px;font-size:.9rem}
.level-content{padding:0 14px 13px;color:#d3dfeb;font-size:.9rem}
.level-content p{margin:5px 0}
.spec-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.spec-card{border:1px solid var(--line);background:#0d2032;border-radius:10px;padding:15px}
.spec-card h3{margin:0 0 7px;color:var(--accent2)}
.spec-card p{font-size:.9rem;color:var(--muted)}

.spec-select{border:1px solid var(--line);border-radius:7px;background:#10283e;color:var(--muted);padding:7px 11px;font-size:.82rem}
.spec-select:hover{border-color:#5484a5;color:var(--accent2)}
.spec-select.active{background:#1b4565;border-color:#6ca4ca;color:#fff}
.level-specialization{margin-top:8px;padding:7px 9px;border-left:3px solid var(--gold);background:rgba(215,184,117,.09);border-radius:0 6px 6px 0}
.level-specialization strong{display:block;color:#f0d9a7;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.level-specialization span{font-size:.87rem;color:#e9e0ce}

.callout{border-left:3px solid var(--gold);padding:12px 15px;background:rgba(215,184,117,.08);color:#e8ddc5;border-radius:0 8px 8px 0}
.empty{padding:18px;color:var(--muted);text-align:center}
.footer{text-align:center;color:var(--muted);font-size:.78rem;padding:24px}
.backdrop{display:none}
@media(max-width:900px){
  .layout{grid-template-columns:180px minmax(0,1fr);gap:12px;padding:14px}
  .info-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .spec-grid{grid-template-columns:1fr}
}
@media(max-width:680px){
  .site-header{height:58px;padding:0 15px}.header-note{display:none}
  .layout{display:block;width:100%;padding:12px}
  /* On narrow screens, place the directory above the class details.
     This avoids a clipped two-column layout and lets the overview grow naturally. */
  .sidebar{position:relative;top:auto;left:auto;bottom:auto;width:100%;height:auto;min-height:0;
    margin:0 0 14px;transform:none;transition:none}
  .mobile-toolbar{display:none}
  .backdrop{display:none}
  .class-hero{padding:21px 19px}
  .content-section{padding:17px 16px}
  .content-nav{top:58px}
  .level-list{grid-template-columns:1fr}
  .info-grid{grid-template-columns:1fr 1fr}
  .class-overview-table th,.class-overview-table td{padding:7px 8px;font-size:.76rem}
  .class-overview-table th{width:36%}
  .class-button{font-size:.82rem}
}
@media(max-width:390px){.info-grid{grid-template-columns:1fr}}


/* Core Mechanics & Resources: content-driven height, wrapping, minimal chrome */
#mechanics {
  display: block;
  box-sizing: border-box;
  width: 100%;
  height: auto;
  min-height: 0;
  max-height: none;
  margin: 14px 0 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  overflow: visible;
}
#mechanics h2 {
  margin: 0 0 10px;
}
#mechanics .feature {
  display: block;
  box-sizing: border-box;
  width: 100%;
  height: auto;
  min-height: 0;
  margin: 8px 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  border-bottom: 1px solid rgba(130, 160, 185, .22);
  background: transparent;
  overflow: visible;
}
#mechanics .feature summary {
  box-sizing: border-box;
  max-width: 100%;
  white-space: normal;
  overflow-wrap: anywhere;
  line-height: 1.45;
  padding: 10px 2px;
}
#mechanics .feature-body {
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
  height: auto;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: normal;
  padding: 2px 2px 12px;
}
#mechanics .feature-body p {
  max-width: 100%;
  white-space: normal;
  overflow-wrap: anywhere;
  margin: 7px 0;
}

/* Simplified 5etools-inspired presentation: remove decorative panels and frames */
.content-section {
  margin: 22px 0;
  padding: 0;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}
.content-section h2 {
  padding: 0 0 7px;
  margin: 0 0 12px;
  border: 0;
  border-bottom: 1px solid rgba(160, 180, 200, .28);
}
.content-section h3 {
  margin: 18px 0 7px;
}
.content-section .feature,
.feature {
  margin: 8px 0;
  padding: 0;
  border: 0 !important;
  border-bottom: 1px solid rgba(160, 180, 200, .18) !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  overflow: visible;
}
.feature summary {
  padding: 9px 2px !important;
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
}
.feature-body {
  padding: 2px 2px 12px !important;
  background: transparent !important;
}
.spec-card,
.info-tile {
  padding: 10px 0;
  border: 0 !important;
  border-bottom: 1px solid rgba(160, 180, 200, .18) !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}
.callout {
  padding: 8px 0 8px 12px;
  border: 0;
  border-left: 2px solid rgba(160, 180, 200, .35);
  border-radius: 0;
  background: transparent;
}
.level {
  border: 0 !important;
  border-bottom: 1px solid rgba(160, 180, 200, .2) !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}
.level summary {
  padding: 9px 2px !important;
  background: transparent !important;
}

/* Slightly more compact typography: reduce text sizing by about 1–2 points */
body { font-size: 14px; }
.site-header { font-size: 13px; }
.sidebar, .class-list, .class-list button { font-size: 13px; }
.content-section { font-size: 13px; }
.content-section p,
.content-section li,
.feature-body,
.level-body,
.muted { font-size: 13px; }
.content-section h2 { font-size: 17px; }
.content-section h3 { font-size: 14px; }
.feature summary,
.level summary { font-size: 13px; }
.progression-table { font-size: 12px; }
.progression-table th,
.progression-table td { font-size: 12px; }

/* Level Details: clean numbered list from Level 1 through Level 20 */
.level-list {
  display: block;
  list-style: decimal;
  margin: 8px 0 0;
  padding-left: 30px;
}
.level-item {
  display: list-item;
  padding: 0;
  margin: 0;
  border: 0;
}
.level-item::marker {
  color: var(--muted);
  font-size: 12px;
}
.level-item .level {
  display: block;
  margin: 0;
  padding: 0;
  border: 0 !important;
  border-bottom: 1px solid rgba(160, 180, 200, .16) !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}
.level-item .level summary {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 10px;
  padding: 8px 2px !important;
  font-size: 13px;
  background: transparent !important;
}
.level-item .level summary::before {
  content: none;
}
.level-number {
  flex: 0 0 62px;
  color: var(--accent2);
  font-weight: 700;
}
.level-label {
  min-width: 0;
  overflow-wrap: anywhere;
  font-weight: 500;
}
.level-content {
  padding: 2px 2px 12px 72px;
  overflow-wrap: anywhere;
}
@media (max-width: 680px) {
  .level-content { padding-left: 8px; }
}

/* Level Details formatted like compact 5etools feature entries */
.level-list {
  display: block;
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
}
.level-item { display: block; margin: 0; padding: 0; }
.level-entry,
.level-specialization-entry {
  display: block;
  margin: 0;
  padding: 0;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  overflow: visible;
}
.level-entry > summary,
.level-specialization-entry > summary {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 6px 2px 3px !important;
  margin: 0;
  border: 0;
  border-bottom: 1px solid rgba(210, 160, 65, .65);
  border-radius: 0;
  background: transparent !important;
  cursor: pointer;
  list-style: none;
}
.level-entry > summary::-webkit-details-marker,
.level-specialization-entry > summary::-webkit-details-marker { display: none; }
.level-entry > summary::before,
.level-specialization-entry > summary::before { content: none !important; }
.level-entry-title {
  color: #d99a28;
  font-family: Georgia, "Times New Roman", serif;
  font-variant: small-caps;
  font-size: 16px;
  line-height: 1.2;
}
.level-source {
  margin-left: auto;
  color: #8d7448;
  font-size: 10px;
  white-space: nowrap;
}
.level-content {
  padding: 3px 2px 8px !important;
  color: #d0d0d0;
  font-size: 13px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.level-content > p { margin: 3px 0 6px; }
.level-specialization-entry { margin: 4px 0 8px 0; }
.level-specialization-entry > summary {
  border-bottom: 0;
  padding: 3px 2px !important;
}
.specialization-entry-title {
  color: #4c9acb;
  font-family: Georgia, "Times New Roman", serif;
  font-variant: small-caps;
  font-size: 15px;
  line-height: 1.2;
}
.level-specialization-entry > p {
  margin: 2px 2px 7px;
  color: #d0d0d0;
  font-size: 13px;
  line-height: 1.45;
}

/* Class Features: compact 5etools-style entries */
#features {
  margin-top: 24px;
}
#features > h2 {
  margin-bottom: 8px;
}
#features > .muted {
  margin: 0 0 16px;
  font-size: 12px;
  line-height: 1.4;
}
#features > h3 {
  margin: 18px 0 2px;
  padding: 0 0 3px;
  color: #d99a28;
  font-family: Georgia, "Times New Roman", serif;
  font-variant: small-caps;
  font-size: 16px;
  font-weight: 600;
  border: 0;
}
#features .feature-type-intro {
  margin: 2px 0 7px;
  color: #aaa;
  font-size: 12px;
  font-style: italic;
  line-height: 1.4;
}
#features details.feature {
  display: block;
  margin: 4px 0 12px;
  padding: 0;
  border: 0 !important;
  border-radius: 0 !important;
  border-bottom: 1px solid rgba(210, 160, 65, .5) !important;
  background: transparent !important;
  box-shadow: none !important;
  overflow: visible;
}
#features details.feature > summary {
  display: block;
  margin: 0;
  padding: 4px 2px 5px !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  color: #d99a28;
  font-family: Georgia, "Times New Roman", serif;
  font-variant: small-caps;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
  cursor: pointer;
  list-style: none;
}
#features details.feature > summary::-webkit-details-marker {
  display: none;
}
#features details.feature > summary::before {
  content: none !important;
}
#features .feature-heading {
  display: inline;
  color: inherit;
  font: inherit;
}
#features .type-tag {
  display: inline;
  margin-left: 7px;
  padding: 0;
  border: 0 !important;
  border-radius: 0;
  background: transparent !important;
  color: #559ac7;
  font-family: Arial, sans-serif;
  font-size: 10px;
  font-variant: normal;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
}
#features .feature-body {
  margin: 0;
  padding: 2px 2px 10px !important;
  color: #d0d0d0;
  font-size: 13px;
  line-height: 1.45;
}
#features .feature-body p {
  margin: 3px 0 6px;
  color: inherit;
  font-size: inherit;
  overflow-wrap: anywhere;
}
#features .feature-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin: 2px 0 7px;
  color: #aaa;
  font-size: 11px;
}
#features .feature-meta span {
  display: inline;
  padding: 0;
  border: 0;
  background: transparent;
}
#features .feature-meta b {
  color: #d5b16a;
}
#features .callout {
  margin: 5px 0 12px;
  padding: 5px 0;
  border: 0;
  background: transparent;
  color: #aaa;
  font-size: 12px;
}
/* How to Play */
.how-to-play-intro{margin:0 0 14px;max-width:900px;color:var(--text)}
.how-core-loop{padding:12px 0;margin:0 0 14px;background:transparent;border:0;border-radius:0}
.how-kicker{display:block;margin:0 0 12px;color:var(--accent2);font-size:.68rem;
  letter-spacing:.1em;text-transform:uppercase}
.how-core-loop p{margin:0;font-weight:750;font-size:.95rem}
.how-overview-table{margin:0 0 14px}
.how-overview-table tr:last-child th,.how-overview-table tr:last-child td{
  border-bottom:1px solid rgba(41,68,93,.7)
}
.how-strategy{padding:14px 0;margin:0 0 12px;background:transparent;border:0;border-radius:0}
.how-strategy h3{margin:0 0 12px;color:var(--text);font-size:1rem}
.how-strategy p{margin:0 0 10px;font-size:.85rem}
.how-strategy p:last-child{margin-bottom:0}
.how-strategy ul{margin:8px 0 0;padding-left:22px;font-size:.85rem}
.how-strategy li{padding:2px 0}



/* Class Browser header: match the shared WoA navigation without inheriting compact prototype layout */
#browserSiteHeader{display:block!important;width:100%!important;height:auto!important;min-height:68px!important;padding:0!important;margin:0!important;border-bottom:1px solid #29445d!important;background:rgba(6,16,28,.96)!important;position:sticky!important;top:0!important;z-index:100!important}
#browserSiteHeader .nav-wrap{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:24px!important;width:100%!important;max-width:1180px!important;min-height:68px!important;margin:0 auto!important;padding:12px 16px!important;box-sizing:border-box!important}
#browserSiteHeader .brand{display:block!important;flex:0 0 auto!important;margin:0 auto 0 0!important;padding:0!important;color:#fff!important;font-size:16px!important;font-weight:800!important;letter-spacing:.12em!important;line-height:1.4!important;white-space:nowrap!important;text-decoration:none!important}
#browserSiteHeader .nav-links{display:flex!important;flex:0 1 auto!important;flex-direction:row!important;align-items:center!important;justify-content:flex-end!important;gap:16px!important;width:auto!important;margin:0!important;padding:0!important;white-space:normal!important}
#browserSiteHeader .nav-links a{display:inline-flex!important;align-items:center!important;min-height:0!important;width:auto!important;margin:0!important;padding:4px 0!important;color:#a8bacb!important;font-size:13px!important;line-height:1.4!important;white-space:nowrap!important;text-decoration:none!important}
#browserSiteHeader .nav-links a:hover{color:#fff!important}
#browserSiteHeader .search-box{display:flex!important;flex:0 0 180px!important;width:180px!important;max-width:180px!important;margin:0!important;padding:0!important}
#browserSiteHeader .search-box input{display:block!important;width:100%!important;max-width:none!important;min-height:36px!important;padding:7px 12px!important;border:1px solid #29445d!important;border-radius:999px!important;background:#071524!important;color:#fff!important;font-size:13px!important;line-height:1.4!important}
@media(max-width:900px){
#browserSiteHeader .nav-wrap{flex-wrap:wrap!important;gap:10px 16px!important}
#browserSiteHeader .nav-links{order:3!important;flex:1 0 100%!important;justify-content:flex-start!important;flex-wrap:wrap!important;gap:8px 14px!important}
#browserSiteHeader .search-box{margin-left:auto!important}
}
@media(max-width:600px){
#browserSiteHeader .nav-wrap{align-items:center!important;padding:10px 14px!important}
#browserSiteHeader .nav-links{gap:6px 12px!important}
#browserSiteHeader .nav-links a{font-size:12px!important}
#browserSiteHeader .search-box{flex:1 1 100%!important;width:100%!important;max-width:none!important}
}

/* Approved Class Browser main-panel arrangement */
.content-section{margin:18px 0;padding:0 0 18px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
.content-section h2{font-size:1.15rem;margin:0 0 12px;padding:0 0 8px;border-bottom:1px solid var(--line);color:var(--accent2)}
.content-section h3{font-size:1rem;margin:16px 0 8px}
.content-nav{position:sticky;top:68px;margin:0 0 12px;padding:10px 0;background:rgba(8,21,34,.98)}
.progression-table{width:100%;min-width:900px;table-layout:fixed;border-collapse:collapse}
.progression-table th:nth-child(1),.progression-table td:nth-child(1){width:5%;min-width:46px;max-width:56px}
.progression-table th:nth-child(2),.progression-table td:nth-child(2){width:12%;min-width:90px}
.progression-table th:nth-child(3),.progression-table td:nth-child(3){width:15%;min-width:100px}
.progression-table th:nth-child(4),.progression-table td:nth-child(4){width:31%;min-width:180px}
.progression-table th:last-child,.progression-table td:last-child{width:20%;min-width:130px}
.level-list{margin-top:8px}
.level-entry{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}


/* Specializations: match approved three-column, open-card layout */
#specializations .spec-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:24px!important;margin:22px 0 16px!important}
#specializations .spec-card{display:block!important;min-width:0!important;padding:8px 0 14px!important;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;background:transparent!important;box-shadow:none!important}
#specializations .spec-card h3{margin:0 0 16px!important;font-size:1rem!important;color:var(--text)!important}
#specializations .spec-card p{margin:0 0 12px!important;font-size:.9rem!important;color:var(--text)!important}
#specializations .spec-card p:last-child{margin-bottom:0!important}
#specializations #specializationSelector{display:flex!important;flex-wrap:wrap!important;align-items:center!important;gap:7px!important;margin:10px 0!important}
#specializations #selectedSpecSummary{margin:10px 0 16px!important;padding:8px 12px!important;border-left:1px solid var(--line)!important;border-radius:0!important;background:transparent!important;color:var(--text)!important;font-size:.9rem!important}
@media(max-width:700px){#specializations .spec-grid{grid-template-columns:1fr!important;gap:10px!important}}


/* Progression tables: flexible for standard classes, structured for seven-column spellcasters. */
#classContentHost .table-wrap{width:100%;max-width:100%;overflow-x:auto}
#classContentHost .progression-table{
  width:100%!important;
  min-width:100%!important;
  max-width:100%;
  table-layout:auto!important;
  border-collapse:collapse;
}
#classContentHost .progression-table th,
#classContentHost .progression-table td{
  min-width:0!important;
  max-width:none;
  padding:8px 9px;
  white-space:normal!important;
  overflow-wrap:anywhere;
  word-break:normal;
  vertical-align:top;
}
#classContentHost .progression-table th:first-child,
#classContentHost .progression-table td:first-child{min-width:48px;text-align:center}

/* Spellcasting classes use seven columns. Give the table enough width and
   explicitly size each column so long headings never collapse to one letter. */
#classContentHost .progression-table:has(th.col-spell-level){
  width:1100px!important;
  min-width:1100px!important;
  max-width:none!important;
  table-layout:fixed!important;
}
#classContentHost .progression-table:has(th.col-spell-level) th:nth-child(1),
#classContentHost .progression-table:has(th.col-spell-level) td:nth-child(1){width:6%!important}
#classContentHost .progression-table:has(th.col-spell-level) th:nth-child(2),
#classContentHost .progression-table:has(th.col-spell-level) td:nth-child(2){width:9%!important}
#classContentHost .progression-table:has(th.col-spell-level) th:nth-child(3),
#classContentHost .progression-table:has(th.col-spell-level) td:nth-child(3){width:10%!important}
#classContentHost .progression-table:has(th.col-spell-level) th:nth-child(4),
#classContentHost .progression-table:has(th.col-spell-level) td:nth-child(4){width:14%!important}
#classContentHost .progression-table:has(th.col-spell-level) th:nth-child(5),
#classContentHost .progression-table:has(th.col-spell-level) td:nth-child(5){width:18%!important}
#classContentHost .progression-table:has(th.col-spell-level) th:nth-child(6),
#classContentHost .progression-table:has(th.col-spell-level) td:nth-child(6){width:26%!important}
#classContentHost .progression-table:has(th.col-spell-level) th:nth-child(7),
#classContentHost .progression-table:has(th.col-spell-level) td:nth-child(7){width:17%!important}
#classContentHost .progression-table:has(th.col-spell-level) th,
#classContentHost .progression-table:has(th.col-spell-level) td{
  white-space:normal!important;
  overflow-wrap:anywhere;
}
@media(max-width:680px){
  #classContentHost .progression-table:not(:has(th.col-spell-level)){min-width:100%!important}
}
function wireClassContent(){
  document.querySelectorAll("#classContentHost .spec-select").forEach(button=>{
    button.addEventListener("click",()=>{
      document.querySelectorAll("#classContentHost .spec-select").forEach(b=>{
        const active=b===button;
        b.classList.toggle("active",active);
        b.setAttribute("aria-pressed",String(active));
      });
      const summary=document.querySelector("#classContentHost #selectedSpecSummary");
      if(summary) summary.textContent="Selected path: "+button.textContent.trim()+".";
    });
  });
  const navLinks=[...document.querySelectorAll("#classContentHost .content-nav a")];
  if("IntersectionObserver" in window){
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting) navLinks.forEach(a=>a.classList.toggle("current",a.getAttribute("href")==="#"+entry.target.id));
      });
    },{rootMargin:"-22% 0px -68% 0px"});
    document.querySelectorAll("#classContentHost .content-section").forEach(s=>observer.observe(s));
  }
}
async function selectClass(c,scroll=true){
  selected=c;
  title.textContent=c;
  renderList();
  host.innerHTML='<p class="muted">Loading '+c+' entries…</p>';
  try{
    const response=await fetch("./class-data/"+slug(c)+".html",{cache:"no-store"});
    if(!response.ok) throw new Error("HTTP "+response.status);
    const markup=await response.text();
    const parsed=new DOMParser().parseFromString(markup,"text/html");
    const root=parsed.getElementById("classData");
    if(!root) throw new Error("The class data file is missing its classData wrapper.");
    const description=root.querySelector("#classDescription");
    desc.textContent=description?description.textContent.trim():"";
    if(description) description.remove();
    host.innerHTML=root.innerHTML;
    const spellNav=host.querySelector("#spellListNav");
    const spellSection=host.querySelector("#spellList");
    if(spellNav && !spellSection) spellNav.remove();
    wireClassContent();
    if(scroll) window.scrollTo({top:0,behavior:"smooth"});
  }catch(error){
    host.innerHTML='<div class="callout"><strong>Unable to load '+c+' entries.</strong><p>Check that classes/class-data/'+slug(c)+'.html exists and is committed.</p></div>';
    console.error(error);
  }
}
search.addEventListener("input",renderList);
document.getElementById("menuButton").addEventListener("click",()=>{
  const open=!document.body.classList.contains("drawer-open");
  document.body.classList.toggle("drawer-open",open);
  document.getElementById("menuButton").setAttribute("aria-expanded",String(open));
});
document.getElementById("backdrop").addEventListener("click",()=>{
  document.body.classList.remove("drawer-open");
  document.getElementById("menuButton").setAttribute("aria-expanded","false");
});
renderList();
const requested=new URLSearchParams(window.location.search).get("class");
const initial=classes.find(c=>c.toLowerCase()===String(requested||"").toLowerCase())||"Gladiator";
selectClass(initial,false);
</script>
