<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08131f"><title>Update Wings of Atreia</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08131f;color:#f4ead2;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:24px;box-sizing:border-box}.card{max-width:560px;width:100%;padding:28px;border:1px solid #3b4654;border-radius:16px;background:#101c2a;box-shadow:0 12px 40px #0006}h1{margin-top:0}button{border:1px solid #d6b053;background:#d6b053;color:#08131f;font-weight:700;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer}#status{margin-top:16px;color:#c9d3dc}</style></head><body><main class="card"><h1>Update Wings of Atreia</h1><p>This clears the old offline cache and reloads the current website. Use this once if an older layout or offline bundle keeps appearing.</p><button id="update">Refresh &amp; Update</button><div id="status" role="status"></div></main><script>document.getElementById('update').addEventListener('click',async()=>{const s=document.getElementById('status');s.textContent='Clearing old offline data…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));s.textContent='Reloading the current version…';location.href='./?updated='+Date.now()}catch(e){s.textContent='Update could not be completed automatically. Please reload this page and try again.'}});</script></body></html>
